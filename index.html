<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030814">
<title>BETCRYPTO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#030814;--bg2:#060D20;--card:#0A1428;--card2:#0F1D40;--line:#142448;
  --text:#EAF1FF;--muted:#7A90B5;--cyan:#2DD4F0;--blue:#3F7BFF;
  --ok:#34D399;--warn:#FBBF24;--bad:#FB7185;
  --safe-t:calc(env(safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Noto Sans Arabic','Noto Sans Devanagari','Noto Sans SC',sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(120% 55% at 50% -8%,#0A1E52 0%,rgba(3,8,20,0) 62%),var(--bg)}
header{flex:none;padding-top:var(--safe-t);background:rgba(2,6,15,.92);border-bottom:1px solid var(--line)}
.hbar{height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;gap:8px}
.hl{justify-self:start;min-width:0;max-width:100%}.hr{justify-self:end;min-width:0;max-width:100%}
.hbtn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;max-width:100%}
.hbtn svg{width:16px;height:16px;flex:none;stroke:var(--cyan);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{font-weight:700;letter-spacing:.14em;font-size:15px;background:linear-gradient(90deg,var(--cyan),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent;user-select:none;text-align:center}
#banner:empty{display:none}
#banner{padding:8px 14px;font-size:12px;line-height:1.45;background:#0A1A3A;color:#BBD0F2;border-top:1px solid var(--line)}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 22px}
.wrap{max-width:560px;margin:0 auto}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:#040A18;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;padding:6px 2px;color:var(--muted);font-size:10px;font-weight:600;min-width:0}
.nb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb.on{color:var(--cyan);box-shadow:inset 0 2px 0 var(--cyan)}
.card{background:linear-gradient(180deg,#0B162E,#081124);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 rgba(130,175,255,.07),0 6px 18px rgba(0,0,0,.35)}
.card h2{margin:0 0 8px;font-size:16px;font-weight:700}
.card h3{margin:14px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.card p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:#C5D3EC}
.card p:last-child{margin-bottom:0}
.hero{border-inline-start:3px solid var(--cyan);background:linear-gradient(135deg,#0C1C42,#060D20)}
.hero h2{font-size:19px}
.muted{color:var(--muted)}.small{font-size:12px;line-height:1.5}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;background:linear-gradient(90deg,var(--cyan),var(--blue));color:#04101F;text-align:center}
.btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn[disabled]{opacity:.55;cursor:default}
.btn+.btn{margin-top:10px}
.lnk{color:var(--cyan);font-weight:600;text-decoration:underline;padding:0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1 1 0;min-width:0;min-height:50px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:8px 8px;text-align:center;font-size:13px;font-weight:600}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:2px;overflow-wrap:anywhere}
.chip.on{border-color:var(--cyan);background:#0A2144;box-shadow:0 0 0 1px var(--cyan) inset}
.chips.two .chip{flex:1 1 40%}
.opt{display:block;width:100%;text-align:start;border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.opt.on{border-color:var(--cyan);background:#0A2144;box-shadow:0 0 0 1px var(--cyan) inset}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:14px 0 8px}
.lbl:first-child{margin-top:0}
.hint{margin:-3px 0 10px;font-size:12.5px;line-height:1.5;color:#9FB4D6}
input.in{width:100%;min-height:48px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);padding:0 14px;font-size:15px;outline:none}
input.in:focus{border-color:var(--cyan)}
.kv{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv>span:first-child{color:var(--muted)}
.kv b{font-weight:600;text-align:end;overflow-wrap:anywhere}
.notice{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.55;background:#0A1A3A;border:1px solid #1C3A6E;margin:10px 0}
.notice b{display:block;margin-bottom:2px}
.notice.warn{background:#2A2210;border-color:#6B5516;color:#FCE9A8}
.notice.bad{background:#2B1218;border-color:#7A2A3A;color:#FFC9D2}
.notice.ok{background:#0F2A22;border-color:#1F6B52;color:#BDF3DD}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:#14244A;color:#BBD0F2}
.badge.ok{background:#0F2A22;color:var(--ok)}.badge.bad{background:#2B1218;color:var(--bad)}.badge.warn{background:#2A2210;color:var(--warn)}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.bal .card{margin:0;padding:14px}
.bal .v{font-size:19px;font-weight:700;margin:6px 0 4px;overflow-wrap:anywhere}
.bal .h{font-size:11.5px;color:var(--muted);line-height:1.45}
.bal .n{font-size:12.5px;font-weight:600}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:10px 0;padding-inline-start:40px;font-size:13.5px;line-height:1.55;color:#C5D3EC;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--cyan);color:var(--cyan);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;line-height:1.6;color:#C5D3EC;margin:0 0 10px}
.addr{direction:ltr;text-align:center;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;word-break:break-all;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.qr{background:#fff;border-radius:16px;padding:14px;width:max-content;max-width:100%;margin:0 auto 14px}
.qr svg{display:block;width:250px;height:250px;max-width:100%}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(3,8,20,.74);display:flex;align-items:flex-end;justify-content:center}
.overlay:empty{display:none}
.sheet{width:100%;max-width:560px;max-height:92%;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.x{min-width:40px;min-height:40px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;padding:0 12px}
.sheet-b{padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lang{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:start;min-height:52px;padding:8px 12px;border-radius:12px;border:1px solid transparent}
.lang:hover,.lang.on{background:var(--card);border-color:var(--line)}
.lang.on{border-color:var(--cyan)}
.lang b{display:block;font-size:14px}.lang small{color:var(--muted);font-size:11.5px}
.lang .mk{color:var(--cyan);font-weight:700}.lang .pt{color:var(--warn);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + var(--safe-b));z-index:80;max-width:calc(100% - 32px);background:#E8F0FF;color:#07122A;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
.hist{margin:0;padding:0;list-style:none}
.hist li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.hist li:last-child{border-bottom:0}
.hist .r{text-align:end;flex:none}
.hist .d{color:var(--muted);font-size:11.5px;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.e,.tbl th.e{text-align:end}
.tbl th{font-weight:600;color:var(--muted);font-size:12px;text-align:start;padding-bottom:6px}
.mkt-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:14px 0 4px;direction:ltr}
.mkt-p{font-size:22px;font-weight:700;overflow-wrap:anywhere}
.mkt-c{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px}
.mkt-c.up{background:#0F2A22;color:var(--ok)}.mkt-c.dn{background:#2B1218;color:var(--bad)}
.mkt-read{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:6px;direction:ltr;text-align:left}
#mktSvg{width:100%;height:auto;display:block;touch-action:pan-y;direction:ltr;user-select:none;-webkit-user-select:none}
#mktSvg text{fill:var(--muted);font-size:9.5px;font-family:inherit}
.mkt-hl{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px;direction:ltr}
.mkt-box{min-height:150px;display:flex;align-items:center}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;line-height:1.5;margin:12px 0;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--cyan);margin:0}
.steps li b{display:block;margin-bottom:2px;color:#EAF1FF}
.qrph{border:1px dashed var(--line);border-radius:16px;padding:22px 14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;margin:0 auto 14px;min-height:278px;width:278px;max-width:100%;display:flex;align-items:center;justify-content:center}
.restrict{border-color:#7A2A3A;background:linear-gradient(180deg,#1A0C16,#0A1428)}
.restrict h2{color:#FFC9D2;letter-spacing:.04em}
#welcome:empty{display:none}
#welcome{position:fixed;inset:0;z-index:45;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:var(--safe-t);padding-bottom:var(--safe-b);
  background:radial-gradient(90% 46% at 50% 0%,#0B2160 0%,rgba(3,8,20,0) 70%),radial-gradient(60% 40% at 100% 100%,rgba(10,42,94,.45) 0%,rgba(3,8,20,0) 70%),var(--bg)}
.wl-wrap{max-width:460px;margin:0 auto;padding:16px 20px 32px;min-height:100%;display:flex;flex-direction:column}
.wl-top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.wl-hero{margin:26px 0 20px}
.wl-hero h1{font-size:34px;line-height:1.12;margin:0 0 10px;font-weight:700;background:linear-gradient(90deg,#fff,#8FD8FF 60%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-hero h1.lp{font-size:26px;letter-spacing:.01em}
.wl-tag{font-size:15.5px;font-weight:600;color:var(--cyan);margin:0 0 18px;line-height:1.45}
.wl-choose{font-size:14.5px;font-weight:600;margin:18px 0 0;color:#EAF1FF;text-align:center}
.wl-pts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.wl-pts li{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(180deg,rgba(15,30,66,.85),rgba(8,17,36,.85));border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;color:#D3E0F6}
.wl-pts li b.up{color:#EAF1FF;text-transform:uppercase}
.wl-pts svg{flex:none;width:22px;height:22px;stroke:var(--cyan);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.wl-actions{margin-top:auto;padding-top:10px;display:grid;gap:10px}
.wl-actions .btn+.btn{margin-top:0}
.wl-actions .lnk{justify-self:center;min-height:40px}
.wl-card{background:linear-gradient(180deg,#0B162E,#081124);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px;box-shadow:inset 0 1px 0 rgba(130,175,255,.07),0 6px 18px rgba(0,0,0,.35)}
.wl-card h2{margin:0 0 10px;font-size:19px}
.wl-card p{margin:0 0 10px;font-size:13.5px;line-height:1.6;color:#C5D3EC}
.wl-card .btn{margin-top:12px}
a.btn{text-decoration:none}
button.lnk[disabled]{opacity:.55;text-decoration:none}
@media (min-width:700px){.wrap{max-width:720px}}
@media (min-width:1000px){
  .wrap{max-width:920px}
  .hbar{max-width:920px;margin:0 auto;width:100%}
  #main{padding:20px 24px 28px}
  nav{align-self:center;width:100%;max-width:640px;border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0}
  .wl-wrap{max-width:520px}
}
.tgbox{display:flex;justify-content:center;min-height:44px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
/* ===================================================================
   BACKEND CONFIGURATION  <<<  PUT YOUR BACKEND URL BELOW  >>>
   API_BASE_URL is a PLACEHOLDER. Replace it with your real backend URL,
   for example "https://api.yourdomain.com". Nothing else needs editing.
   The paths below are the paths this frontend will CALL. They are a
   proposed contract: build your backend to match them, or edit them here.
   Nothing is connected until you do this.
   =================================================================== */
const CONFIG = {
  API_BASE_URL: "YOUR_BACKEND_URL_HERE",
  /* Official BETCRYPTO bot (same bot as the approved invitation message). Change here if it ever changes. */
  TELEGRAM_BOT_LINK: "https://t.me/Betcryptoassetbot",
  /* "start" opens the bot chat with the referral code. Use "startapp" to open the Mini App directly once it is configured in BotFather. */
  TELEGRAM_START_PARAM: "start",
  /* "Explore the app first" on the website welcome page lets you look around without an account (for testing).
     BEFORE LAUNCH change true to false, save, and real visitors will no longer see it. */
  ALLOW_EXPLORE: false
};
/* Referral links this page understands (the code is kept through the whole sign-up):
     https://YOUR-SITE/?ref=CODE      https://YOUR-SITE/#ref=CODE      https://YOUR-SITE/ref/CODE (needs a host that serves index.html for /ref/*)
   Your backend creates each user's personal link and code. Nothing is hardcoded here. */
const ENDPOINTS = {
  auth: "/auth/telegram",            // POST {initData} -> {token, user:{accountId, username, status:"active|suspended|banned", ageConfirmed:true|false}}
  session: "/auth/session",          // GET (secure cookie) -> {user:{accountId, username, status, ageConfirmed}} or 401   [website visitors]
  emailStart: "/auth/email/start",   // POST {email, referralCode?} -> 2xx   (the system emails a short-lived, single-use code)
  emailVerify: "/auth/email/verify", // POST {email, code, password} -> {verified:true, ticket}   (ticket is short-lived and single-use)
  register: "/auth/register",        // POST {ticket, username, referralCode?} -> {user:{...}} + secure session cookie. The system creates the user ID and records the referral.
  login: "/auth/login",              // POST {identifier, password} -> {user:{...}} + secure session cookie
  logout: "/auth/logout",            // POST -> 2xx (clears the cookie)
  resetStart: "/auth/password-reset/start",     // POST {email} -> always 2xx (no account enumeration)
  resetConfirm: "/auth/password-reset/confirm", // POST {email, code, password} -> 2xx,
  telegramLogin: "/auth/telegram-login",       // POST {authData} (signed data from the Telegram Login button) -> {user:{...}} + session cookie. Your system must verify the signature with the bot token. 404 if no account has this Telegram ID.
  emailLinkStart: "/profile/email/start",      // POST {email} -> 2xx   (optional email for a signed-in user; the system emails a code)
  emailLinkVerify: "/profile/email/verify",    // POST {email, code} -> {user:{..., email, emailVerified:true}}
  accountLinkStart: "/auth/link/start",        // Telegram user: POST {identifier, password} of an existing browser account -> 2xx (the system emails a code to that account)
  accountLinkConfirm: "/auth/link/confirm",    // POST {code} -> {user:{...}}  The existing account gains this Telegram ID. 409 {code:"TELEGRAM_ALREADY_LINKED"} if it belongs to another account.
  telegramLinkToken: "/auth/link/telegram-token", // Browser user: POST {} -> {token}. The page then opens the bot with start=link_<token>; the system links the Telegram ID that opens it.
  profile: "/profile",               // GET -> {accountId, username, status:"active|suspended|banned", ageConfirmed:true|false}
  setUsername: "/profile/username",  // POST {username} -> {username}  (409 if taken)
  ageConfirm: "/profile/age-confirmation", // POST {confirmed:true, policyVersion} -> {confirmed:true}  (backend stores it with a timestamp)
  balances: "/balances",             // GET -> {deposit, earnings, holdings:{BTC,ETH,SOL}, qualifyingReferrals, withdrawNetworks:["TRC20","ERC20","BEP20","TON"] (optional)}
  transactions: "/transactions",     // GET -> {items:[{id,type,status,amount,asset,createdAt}]}
  notifications: "/notifications",   // GET -> {items:[{id,text,createdAt}]}
  referral: "/referral",             // GET -> {link, qualifyingCount, items:[{id,label,status,reward,createdAt}]}
  bets: "/bets",                     // GET -> {items:[...]}  (settlement happens only on the backend)
  betCreate: "/bets",                // POST {coin,prediction,stake,durationDays} -> {accepted:true,...}
  buyQuote: "/buy/quote",            // POST {coin,amountUsdt} -> {quoteId,estimatedAmount,fee,feeAsset,expiresAt}
  buyExecute: "/buy/execute",        // POST {quoteId} -> {completed:true,...}
  depositAddress: "/deposit/address", // GET ?network=TRC20|ERC20|BEP20|TON&currency=USDT_TRX|USDT|USDT_BSC|USDT_TON -> {network, currency, address, deposits:[...]}. "network" is REQUIRED in the reply.
  withdrawCreate: "/withdrawals",    // POST {asset, network (for USDT), amount, address} -> {accepted:true,...}
  translations: "/translations",     // POST {source,target,strings} -> {strings}  (optional, for extra languages)
  prices: "",                        // optional backend price feed, e.g. "/prices" -> {BTC,ETH,SOL}. Empty = off. When set, it is tried FIRST.
  chart: ""                          // optional backend chart feed, e.g. "/chart" (called as /chart?coin=BTC) -> {points:[[timestamp,price],...]} (7 days, hourly). Empty = off. When set, it is tried FIRST.
};
</script>

<body>
<div id="app">
  <header>
    <div class="hbar">
      <div class="hl"><button type="button" class="hbtn" id="bProfile" data-act="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span id="tProfile">Profile</span></button></div>
      <div class="brand" aria-label="BETCRYPTO">BETCRYPTO</div>
      <div class="hr"><button type="button" class="hbtn" id="bLang" data-act="language"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg><span id="tLang">Language</span></button></div>
    </div>
    <div id="banner"></div>

/* ---------------- i18n ---------------- */
function curDict(){return TR[S.lang]||LOADED[S.lang]||null;}
function t(k,v){
  const d=curDict();
  let s=(d&&d[k]!=null)?d[k]:TR.en[k];
  if(s==null)return k;
  if(v){for(const x in v)s=s.split('{'+x+'}').join(v[x]);}
  return s;
}
const T=(k,v)=>esc(t(k,v));
function langInfo(code){return LANGS.find(l=>l.code===code)||LANGS[0];}
function isFull(code){
  if(TR[code])return true;
  const d=LOADED[code];
  if(!d)return false;
  for(const k in TR.en){if(!d[k])return false;}
  return true;
}
function applyLang(){
  const l=langInfo(S.lang);
  document.documentElement.lang=l.code;
  document.documentElement.dir=l.rtl?'rtl':'ltr';
}
async function loadTranslations(code){
  if(TR[code]||LOADED[code])return;
  const cached=store.get('bc_tr_'+code);
  if(cached){
    try{const o=JSON.parse(cached);if(o&&typeof o==='object'){LOADED[code]=o;if(code===S.lang)rerender();return;}}catch(e){}
  }
  if(!backendReady())return;
  try{
    /* Backend must translate the values, keep keys, and keep {placeholders} unchanged. */
    const d=await api('POST','translations',{source:'en',target:code,strings:TR.en});
    if(d&&d.strings&&typeof d.strings==='object'){
      const clean={};
      for(const k in TR.en){if(typeof d.strings[k]==='string'&&d.strings[k])clean[k]=d.strings[k];}
      LOADED[code]=clean;
      store.set('bc_tr_'+code,JSON.stringify(clean));
      if(code===S.lang)rerender();
    }
  }catch(e){}
}
function setLang(code){
  S.lang=code;
  store.set('bc_lang',code);
  S.firstLang=false;
  S.overlay=null;
  applyLang();
  loadTranslations(code);
  rerender();
}

/* ---------------- formatting ---------------- */
function nf(opts){try{return new Intl.NumberFormat(S.lang,opts);}catch(e){return new Intl.NumberFormat('en',opts);}}
function fmtNum(n,max){if(n==null)return '—';return nf({maximumFractionDigits:max==null?8:max}).format(n);}
function fmtUsd(n){if(n==null)return '—';return nf({style:'currency',currency:'USD',maximumFractionDigits:2,minimumFractionDigits:2}).format(n);}
function fmtDate(x){
  if(!x)return '';
  const d=new Date(x);
  if(isNaN(d.getTime()))return '';
  try{return d.toLocaleString(S.lang,{dateStyle:'medium',timeStyle:'short'});}catch(e){return d.toLocaleString();}
}
function parseAmt(s){
  const x=String(s==null?'':s).trim().replace(',','.');
  if(!/^\d*\.?\d+$|^\d+\.?$/.test(x))return null;
  const n=parseFloat(x);
  return(isFinite(n)&&n>0)?n:null;
}
const ltr=h=>'<span class="ltr">'+h+'</span>';

/* ---------------- toast ---------------- */
let toastTimer=null;
function toast(msg){
  const el=$('#toast');
  el.textContent=msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}
async function copyText(text){
  try{
    if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;}
  }catch(e){}
  try{
    const ta=document.createElement('textarea');
    ta.value=text;ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){return false;}
}

/* ---------------- prices (Binance primary, CoinGecko backup) ---------------- */
async function fetchJSON(url,ms){
  const c=new AbortController();
  const to=setTimeout(()=>c.abort(),ms||8000);
  try{
    const r=await fetch(url,{signal:c.signal,cache:'no-store',credentials:'omit'});
    if(!r.ok)throw new Error('http '+r.status);
    return await r.json();
  }finally{clearTimeout(to);}
}
async function pricesBinance(host){
  const q=encodeURIComponent('["BTCUSDT","ETHUSDT","SOLUSDT"]');
  const d=await fetchJSON('https://'+host+'/api/v3/ticker/price?symbols='+q);
  const m={};
  (Array.isArray(d)?d:[]).forEach(x=>{
    const c=String(x.symbol||'').replace('USDT','');
    const p=num(x.price);
    if(COINS.indexOf(c)>-1&&p>0)m[c]=p;
  });
  if(COINS.some(c=>!(m[c]>0)))throw new Error('incomplete');
  return m;
}
async function pricesCoinGecko(){
  const d=await fetchJSON('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd');
  const m={BTC:num(d.bitcoin&&d.bitcoin.usd),ETH:num(d.ethereum&&d.ethereum.usd),SOL:num(d.solana&&d.solana.usd)};
  if(COINS.some(c=>!(m[c]>0)))throw new Error('incomplete');
  return m;
}
async function pricesCoinbase(){
  const m={};
  await Promise.all(COINS.map(async c=>{
    const d=await fetchJSON('https://api.coinbase.com/v2/prices/'+c+'-USD/spot');
    m[c]=num(d&&d.data&&d.data.amount);
  }));
  if(COINS.some(c=>!(m[c]>0)))throw new Error('incomplete');
  return m;
}
async function pricesKraken(){
  const d=await fetchJSON('https://api.kraken.com/0/public/Ticker?pair=XBTUSD,ETHUSD,SOLUSD');
  if(!d||(d.error&&d.error.length)||!d.result)throw new Error('bad');
  const m={};
  Object.keys(d.result).forEach(k=>{
    const c=(k.indexOf('XBT')>-1||k.indexOf('BTC')>-1)?'BTC':(k.indexOf('ETH')>-1?'ETH':(k.indexOf('SOL')>-1?'SOL':null));
    if(c)m[c]=num(d.result[k].c&&d.result[k].c[0]);
  });
  if(COINS.some(c=>!(m[c]>0)))throw new Error('incomplete');
  return m;
}
async function pricesCryptoCompare(){
  const d=await fetchJSON('https://min-api.cryptocompare.com/data/pricemulti?fsyms=BTC,ETH,SOL&tsyms=USD');
  const m={};
  COINS.forEach(c=>{m[c]=num(d&&d[c]&&d[c].USD);});
  if(COINS.some(c=>!(m[c]>0)))throw new Error('incomplete');
  return m;
}
async function pricesBackend(){
  const d=await api('GET','prices');
  const m={BTC:num(d&&d.BTC),ETH:num(d&&d.ETH),SOL:num(d&&d.SOL)};
  if(COINS.some(c=>!(m[c]>0)))throw new Error('incomplete');
  return m;
}
let pricesBusy=false;
async function refreshPrices(){
  if(pricesBusy)return;
  pricesBusy=true;
  /* Order: your backend feed (if configured), then Binance, Coinbase, Kraken, CoinGecko, CryptoCompare. */
  const tries=[
    ['Binance',()=>pricesBinance('api.binance.com')],
    ['Binance',()=>pricesBinance('data-api.binance.vision')],
    ['Coinbase',pricesCoinbase],
    ['Kraken',pricesKraken],
    ['CoinGecko',pricesCoinGecko],
    ['CryptoCompare',pricesCryptoCompare]
  ];
  if(ENDPOINTS.prices&&backendReady())tries.unshift(['BETCRYPTO',pricesBackend]);
  let got=false;
  for(const tr of tries){
    try{
      S.prices=await tr[1]();S.priceSrc=tr[0];S.priceTs=Date.now();S.priceS='ok';got=true;break;
    }catch(e){}
  }
  if(!got){S.prices=null;S.priceS='error';S.priceSrc='';}
  pricesBusy=false;
  if(['bet','buy','earn','withdraw'].indexOf(S.route)>-1)renderMain();
  if(S.route==='earn')loadChart(S.mkt.coin,true);
}

/* ---------------- backend ---------------- */
function backendReady(){
  const u=CONFIG&&CONFIG.API_BASE_URL;
  return typeof u==='string'&&/^https?:\/\/[^\s]+$/.test(u);
}
function newKey(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,12);
}
function keyFor(sig){if(!KEYS[sig])KEYS[sig]=newKey();return KEYS[sig];}
async function api(method,key,body,idem,query){
  if(!backendReady())throw{code:'NOT_CONFIGURED'};
  const path=ENDPOINTS[key];
  if(!path)throw{code:'NOT_CONFIGURED'};
  const url=CONFIG.API_BASE_URL.replace(/\/+$/,'')+path+(query?'?'+query:'');
  const h={'Accept':'application/json'};
  if(body!==undefined)h['Content-Type']='application/json';
  if(S.session.token)h['Authorization']='Bearer '+S.session.token;
  if(idem)h['Idempotency-Key']=idem;
  const c=new AbortController();
  const to=setTimeout(()=>c.abort(),20000);
  let r;
  try{
    r=await fetch(url,{method,headers:h,body:body!==undefined?JSON.stringify(body):undefined,signal:c.signal,credentials:(IN_TG?'omit':'include')});
  }catch(e){clearTimeout(to);throw{code:'NETWORK'};}
  clearTimeout(to);
  let data=null;
  try{data=await r.json();}catch(e){}
  if(!r.ok){
    if(r.status===403&&data&&(data.code==='ACCOUNT_SUSPENDED'||data.code==='ACCOUNT_BANNED')){
      R.profile={s:'ok',v:Object.assign({},val('profile')||{},{status:data.code==='ACCOUNT_BANNED'?'banned':'suspended'})};
      renderMain();
    }
    throw{code:'HTTP',status:r.status,data:data};
  }
  return data;
}
/* 'ok' | 'unavailable' | 'signin' | 'error' | 'loading' */
function gate(){
  if(!backendReady())return 'unavailable';
  const s=S.session.s;
  if(s==='ok')return 'ok';
  if(s==='outside')return 'signin';
  if(s==='error')return 'error';
  return 'loading';
}
/* Account status. The backend is the only authority; nothing here is read from localStorage. */
function acctStatus(){
  if(!backendReady())return 'none';
  const s=S.session.s;
  if(s==='outside')return 'none';
  if(s==='idle'||s==='loading')return 'checking';
  if(s==='error')return 'unverified';
  if(s==='ok'){
    const p=val('profile');
    const st=(p&&typeof p.status==='string')?p.status.toLowerCase():'';
    if(st==='active'||st==='suspended'||st==='banned')return st;
    return 'unverified';   /* never assume active when the backend did not say so */
  }
  return 'none';
}
function acctBlocked(){return ['suspended','banned','unverified','checking'].indexOf(acctStatus())>-1;}
function hasAccount(){
  if(gate()!=='ok')return null;
  const p=val('profile');
  if(!p)return null;
  return !!(typeof p.username==='string'&&p.username);
}
function guardMsg(){
  const g=gate();
  if(g==='ok'){
    const st=acctStatus();
    if(st==='suspended')return t('acct_susp_title');
    if(st==='banned')return t('acct_ban_title');
    if(st==='unverified')return t('acct_verify_body');
    if(st==='checking')return t('acct_checking');
    return null;
  }
  if(g==='unavailable')return t('unavail_title')+'. '+t('unavail_body');
  if(g==='signin')return t('signin_needed');
  if(g==='error')return t('load_error');
  return t('loading');
}
function extra(d){return(d&&typeof d.message==='string'&&d.message)?(' '+d.message.slice(0,200)):'';}
async function initSession(){
  if(!backendReady()){S.session.s='unconfigured';return;}
  if(!initData){
    S.session.s='loading';
    try{
      const d=await api('GET','session');
      if(d&&d.user&&typeof d.user==='object'){S.session.s='ok';S.session.web=true;R.profile={s:'ok',v:d.user};S.web.screen=null;return;}
    }catch(e){}
    S.session.s='outside';
    return;
  }
  S.session.s='loading';
  try{
    const d=await api('POST','auth',{initData:initData});
    if(d&&typeof d.token==='string'&&d.token){
      S.session.token=d.token;S.session.s='ok';
      if(d.user&&typeof d.user==='object')R.profile={s:'ok',v:d.user};
    }else throw 0;
  }catch(e){S.session.s='error';}
}
const EP={balances:'balances',transactions:'transactions',notifications:'notifications',referral:'referral',bets:'bets',deposit:'depositAddress',profile:'profile'};
function val(name){const r=R[name];return(r&&(r.s==='ok'||(r.s==='loading'&&r.v!==undefined)))?r.v:null;}
async function load(name){
  if(name!=='profile'&&acctBlocked())return;
  const g=gate();
  if(g!=='ok'){
    R[name]={s:g==='unavailable'?'unavailable':g==='signin'?'signin':g==='error'?'error':'loading'};
    renderMain();
    if(S.overlay==='deposit'||S.overlay==='profile')renderOverlay();
    return;
  }
  const prev=R[name]&&R[name].v;

  }catch(e){R[name]=(name==='profile'&&prev!==undefined)?{s:'ok',v:prev}:{s:'error'};}

/* ---------------- live market chart (Earnings page) ----------------
   Data: your backend chart feed (if configured), then Binance, Coinbase, Kraken, CoinGecko, CryptoCompare (all free public APIs, 1h points for 7 days).
   No API keys are used or needed. Nothing is simulated: if no source answers, "unavailable" is shown. */
const MK={};
const CGID={BTC:'bitcoin',ETH:'ethereum',SOL:'solana'};
const CH={W:340,H:190,L:6,R:60,T:10,B:22};
let CHART=null;
async function klinesBinance(host,coin){
  const d=await fetchJSON('https://'+host+'/api/v3/klines?symbol='+coin+'USDT&interval=1h&limit=168',9000);
  if(!Array.isArray(d))throw new Error('bad');
  return d.map(k=>[Number(k[0]),parseFloat(k[4])]);
}
async function chartCoinGecko(coin){
  const d=await fetchJSON('https://api.coingecko.com/api/v3/coins/'+CGID[coin]+'/market_chart?vs_currency=usd&days=7',9000);
  if(!d||!Array.isArray(d.prices))throw new Error('bad');
  return d.prices.map(p=>[Number(p[0]),Number(p[1])]);
}
async function chartCoinbase(coin){
  const d=await fetchJSON('https://api.exchange.coinbase.com/products/'+coin+'-USD/candles?granularity=3600',9000);
  if(!Array.isArray(d))throw new Error('bad');
  return d.slice(0,168).map(k=>[Number(k[0])*1000,Number(k[4])]).sort((a,b)=>a[0]-b[0]);
}
async function chartKraken(coin){
  const pair={BTC:'XBTUSD',ETH:'ETHUSD',SOL:'SOLUSD'}[coin];
  const d=await fetchJSON('https://api.kraken.com/0/public/OHLC?pair='+pair+'&interval=60',9000);
  if(!d||(d.error&&d.error.length)||!d.result)throw new Error('bad');
  const key=Object.keys(d.result).find(k=>k!=='last');
  const a=d.result[key];
  if(!Array.isArray(a))throw new Error('bad');
  return a.slice(-168).map(k=>[Number(k[0])*1000,parseFloat(k[4])]);
}
async function chartCryptoCompare(coin){
  const d=await fetchJSON('https://min-api.cryptocompare.com/data/v2/histohour?fsym='+coin+'&tsym=USD&limit=167',9000);
  const a=d&&d.Data&&d.Data.Data;
  if(!Array.isArray(a))throw new Error('bad');
  return a.map(k=>[Number(k.time)*1000,Number(k.close)]);
}
async function chartBackend(coin){
  const d=await api('GET','chart',undefined,undefined,'coin='+encodeURIComponent(coin));
  const a=d&&d.points;
  if(!Array.isArray(a))throw new Error('bad');
  return a.map(k=>[(Number(k[0])<1e12?Number(k[0])*1000:Number(k[0])),Number(k[1])]);
}
function validPts(p){return Array.isArray(p)&&p.length>=24&&p.every(x=>isFinite(x[0])&&isFinite(x[1])&&x[1]>0);}
async function loadChart(coin,force){
  try{
    const m=MK[coin];
    if(m&&m.s==='loading')return;
    if(!force&&m&&m.s==='ok'&&Date.now()-m.ts<55000)return;
    MK[coin]={s:'loading',pts:m&&m.pts,src:m&&m.src,ts:m?m.ts:0};
    if(S.route==='earn')renderMain();
    const tries=[
      ['Binance',()=>klinesBinance('api.binance.com',coin)],
      ['Binance',()=>klinesBinance('data-api.binance.vision',coin)],
      ['Coinbase',()=>chartCoinbase(coin)],
      ['Kraken',()=>chartKraken(coin)],
      ['CoinGecko',()=>chartCoinGecko(coin)],
      ['CryptoCompare',()=>chartCryptoCompare(coin)]
    ];
    if(ENDPOINTS.chart&&backendReady())tries.unshift(['BETCRYPTO',()=>chartBackend(coin)]);
    let ok=null;
    for(const tr of tries){
      try{const p=await tr[1]();if(validPts(p)){ok={pts:p,src:tr[0]};break;}}catch(e){}
    }
    MK[coin]=ok?{s:'ok',pts:ok.pts,src:ok.src,ts:Date.now()}:{s:'error'};
    if(S.route==='earn')renderMain();
  }catch(e){MK[coin]={s:'error'};}
}
function chartGeom(pts){
  let lo=Infinity,hi=-Infinity;
  pts.forEach(p=>{if(p[1]<lo)lo=p[1];if(p[1]>hi)hi=p[1];});
  const rawLo=lo,rawHi=hi;
  const pad=(hi-lo)*0.08||hi*0.01;lo-=pad;hi+=pad;
  const t0=pts[0][0],t1=pts[pts.length-1][0];
  return{lo:lo,hi:hi,rawLo:rawLo,rawHi:rawHi,t0:t0,t1:t1,
    x:t=>CH.L+(t-t0)/((t1-t0)||1)*(CH.W-CH.L-CH.R),
    y:v=>CH.T+(hi-v)/((hi-lo)||1)*(CH.H-CH.T-CH.B)};
}
function fmtAxis(v){
  const big=v>=1000;
  return nf({style:'currency',currency:'USD',maximumFractionDigits:big?0:2,minimumFractionDigits:big?0:2}).format(v);
}
function fmtDay(ts){try{return new Date(ts).toLocaleDateString(S.lang,{month:'short',day:'numeric'});}catch(e){return '';}}
function vMarket(){

  }else if(!pts){
    body='<div class="mkt-box"><p class="muted" style="margin:0">'+T('loading')+'</p></div>';

  }
  return '<div class="card"><h2>'+T('mkt_title')+'</h2>'+tabs+body+'</div>';
}
function chartHtml(c,pts,m){
  const g=chartGeom(pts);
  const first=pts[0][1],last=pts[pts.length-1][1];
  const live=price(c)||last;
  const chg=(live-first)/first*100;
  const up=live>=first;
  const col=up?'var(--ok)':'var(--bad)';
  CHART={pts:pts,g:g,coin:c};
  let grid='';
  for(let i=0;i<4;i++){
    const v=g.lo+(g.hi-g.lo)*i/3,y=g.y(v).toFixed(1);
    grid+='<line x1="'+CH.L+'" x2="'+(CH.W-CH.R)+'" y1="'+y+'" y2="'+y+'" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="2 4"/>'+
      '<text x="'+(CH.W-CH.R+6)+'" y="'+(Number(y)+3)+'">'+esc(fmtAxis(v))+'</text>';
  }
  const line=pts.map((p,i)=>(i?'L':'M')+g.x(p[0]).toFixed(1)+' '+g.y(p[1]).toFixed(1)).join('');
  const base=(CH.H-CH.B);
  const area=line+'L'+g.x(pts[pts.length-1][0]).toFixed(1)+' '+base+'L'+g.x(pts[0][0]).toFixed(1)+' '+base+'Z';
  const mid=(g.t0+g.t1)/2;
  const ly=g.y(last).toFixed(1);
  const xl='<text x="'+CH.L+'" y="'+(CH.H-6)+'" text-anchor="start">'+esc(fmtDay(g.t0))+'</text>'+
    '<text x="'+((CH.W-CH.R+CH.L)/2)+'" y="'+(CH.H-6)+'" text-anchor="middle">'+esc(fmtDay(mid))+'</text>'+
    '<text x="'+(CH.W-CH.R)+'" y="'+(CH.H-6)+'" text-anchor="end">'+esc(fmtDay(g.t1))+'</text>';
  const gid='mg'+c;
  const svg='<svg id="mktSvg" viewBox="0 0 '+CH.W+' '+CH.H+'" role="img" aria-label="'+esc(c)+'">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:'+col+';stop-opacity:.32"/><stop offset="100%" style="stop-color:'+col+';stop-opacity:0"/></linearGradient></defs>'+
    grid+
    '<path d="'+area+'" fill="url(#'+gid+')"/>'+
    '<path d="'+line+'" fill="none" style="stroke:'+col+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<line x1="'+CH.L+'" x2="'+(CH.W-CH.R)+'" y1="'+ly+'" y2="'+ly+'" style="stroke:'+col+'" stroke-width=".8" stroke-dasharray="3 3" opacity=".7"/>'+
    '<circle cx="'+g.x(pts[pts.length-1][0]).toFixed(1)+'" cy="'+ly+'" r="3" style="fill:'+col+'"/>'+
    xl+
    '<line id="mktLine" x1="0" x2="0" y1="'+CH.T+'" y2="'+base+'" style="stroke:var(--muted)" stroke-width=".8" visibility="hidden"/>'+
    '<circle id="mktDot" cx="0" cy="0" r="3.5" style="fill:#fff;stroke:'+col+'" stroke-width="1.5" visibility="hidden"/>'+
    '<rect x="0" y="0" width="'+CH.W+'" height="'+CH.H+'" fill="transparent"/>'+
    '</svg>';
  return '<div class="mkt-top"><span class="mkt-p">'+esc(fmtUsd(live))+'</span><span class="mkt-c '+(up?'up':'dn')+'">'+(up?'▲ ':'▼ ')+esc(nf({maximumFractionDigits:2,minimumFractionDigits:2,signDisplay:'exceptZero'}).format(chg))+'%</span></div>'+
    '<div class="mkt-read" id="mktRead">'+T('mkt_7d')+'</div>'+svg+
    '<div class="mkt-hl"><span>'+T('mkt_high')+': '+esc(fmtUsd(g.rawHi))+'</span><span>'+T('mkt_low')+': '+esc(fmtUsd(g.rawLo))+'</span></div>'+
    '<p class="muted small" style="margin:8px 0 0">'+T('price_note',{src:m.src})+'</p>';
}
function mktScrub(e){
  const svg=$('#mktSvg');
  if(!svg||!CHART)return;
  const r=svg.getBoundingClientRect();
  if(!r.width)return;
  const px=(e.clientX-r.left)/r.width*CH.W;
  const g=CHART.g,pts=CHART.pts;
  const tt=g.t0+(px-CH.L)/((CH.W-CH.L-CH.R)||1)*(g.t1-g.t0);
  let bi=0,bd=Infinity;
  for(let i=0;i<pts.length;i++){const d=Math.abs(pts[i][0]-tt);if(d<bd){bd=d;bi=i;}}
  const p=pts[bi],x=g.x(p[0]),y=g.y(p[1]);
  const ln=$('#mktLine'),dt=$('#mktDot'),rd=$('#mktRead');
  if(ln){ln.setAttribute('x1',x);ln.setAttribute('x2',x);ln.setAttribute('visibility','visible');}
  if(dt){dt.setAttribute('cx',x);dt.setAttribute('cy',y);dt.setAttribute('visibility','visible');}
  if(rd){let ds='';try{ds=new Date(p[0]).toLocaleString(S.lang,{dateStyle:'medium',timeStyle:'short'});}catch(er){}rd.textContent=fmtUsd(p[1])+' · '+ds;}
}
function mktHide(){
  const ln=$('#mktLine'),dt=$('#mktDot'),rd=$('#mktRead');
  if(ln)ln.setAttribute('visibility','hidden');
  if(dt)dt.setAttribute('visibility','hidden');
  if(rd)rd.textContent=t('mkt_7d');
}
document.addEventListener('pointermove',e=>{if(e.target.closest&&e.target.closest('#mktSvg'))mktScrub(e);});
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#mktSvg'))mktScrub(e);});
document.addEventListener('pointerout',e=>{
  if(e.target.closest&&e.target.closest('#mktSvg')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#mktSvg')))mktHide();
});
document.addEventListener('pointercancel',mktHide);

function badgeCls(s){

function statusBadge(s){
  const k=STATUS[String(s||'').toLowerCase()];
  return '<span class="badge '+badgeCls(s)+'">'+(k?T(k):esc(s))+'</span>';
}
function msgBox(m){return m?noteHtml(m.kind==='ok'?'ok':m.kind==='warn'?'warn':'bad',null,esc(m.text)):'';}
function coinChips(sel,act){
  return '<div class="chips">'+COINS.map(c=>{
    const p=price(c);
    return '<button type="button" class="chip'+(sel===c?' on':'')+'" data-act="'+act+'" data-v="'+c+'"><span>'+c+'</span><small>'+(p?ltr(esc(fmtUsd(p))):T('price_unavailable'))+'</small></button>';
  }).join('')+'</div>';
}
function priceFoot(){
  return S.priceS==='ok'?'<p class="muted small" style="margin:4px 2px 12px">'+T('price_note',{src:S.priceSrc})+'</p>':'';
}
function txList(items,limit){
  return '<ul class="hist">'+items.slice(0,limit||60).map(x=>{
    const k=TXT[String(x.type||'').toLowerCase()];
    const amt=num(x.amount);
    return '<li><div><div>'+(k?T(k):esc(x.type))+'</div><div class="d">'+esc(fmtDate(x.createdAt))+'</div></div><div class="r"><div>'+(amt!=null?ltr(esc(fmtNum(amt,8))+' '+esc(x.asset||'USDT')):'')+'</div><div>'+statusBadge(x.status)+'</div></div></li>';
  }).join('')+'</ul>';
}
function refLink(){
  const r=val('referral');
  const l=(r&&typeof r.link==='string')?r.link.trim():'';
  return /^https:\/\/\S+$/.test(l)?l:null;
}
const INVITE=link=>'🔥 Join BetCrypto and claim your winnings!\n💰 Trade BTC, ETH, SOL & win big\n👉 Join here: '+link+'\n\nInvite friends & earn 10 USDT per person instantly to your EARNING!';
function notifPromptHtml(){
  /* Shown only inside Telegram (Bot API 6.9+), only if the user has not already allowed the bot to message them. */
  if(!tg||typeof tg.requestWriteAccess!=='function')return '';
  try{if(typeof tg.isVersionAtLeast==='function'&&!tg.isVersionAtLeast('6.9'))return '';}catch(e){return '';}
  if(tgUser&&tgUser.allows_write_to_pm)return '';
  if(store.get('bc_notif')==='1')return '';
  return '<div style="margin-top:12px"><p>'+T('notif_allow_text')+'</p><button type="button" class="btn sec" data-act="allowNotif">'+T('notif_allow_btn')+'</button></div>';
}
function lowBalance(amount){
  const b=val('balances');
  const d=b?num(b.deposit):null;
  return d!=null&&amount>d;   /* only when the balance is known; the backend always makes the final check */
}
function refCount(){
  const b=val('balances'),r=val('referral');
  const a=b?num(b.qualifyingReferrals):null;
  if(a!=null)return a;
  return r?num(r.qualifyingCount):null;
}

function wdCalc(){
  const amt=parseAmt(S.wd.amount);
  if(!amt)return '<span class="muted">—</span>';
  const p=price(S.wd.asset);
  if(!p)return T('price_unavailable');
  return ltr(esc(fmtUsd(amt*p)));
}
function wdRe(){
  if(S.wd.asset==='USDT'){const n=netById(S.wd.network);return n?n.re:null;}
  return ADDR[S.wd.asset]||null;
}
function wdNetsFromBackend(){
  const b=val('balances');
  if(!b||!Array.isArray(b.withdrawNetworks))return null;
  return b.withdrawNetworks.map(x=>String(x).toUpperCase().replace(/[^A-Z0-9]/g,''));
}
function netAvail(n){
  const l=wdNetsFromBackend();
  if(!l)return true;    /* backend did not list networks: it validates on submit */
  return l.indexOf(n.id)>-1||n.alias.some(a=>l.indexOf(a)>-1);
}
function wdError(){
  const a=S.wd.asset;
  if(a==='USDT'){const n=netById(S.wd.network);if(!n||!netAvail(n))return 'wd_e_network';}
  const amt=parseAmt(S.wd.amount);
  if(!amt)return 'wd_e_amount';
  const re=wdRe();
  if(!re||!re.test(String(S.wd.address||'').trim()))return 'wd_e_address';
  const p=price(a);
  if(!p)return 'wd_e_price';
  const usd=amt*p;
  if(usd<MIN_WD)return 'wd_e_min';
  const b=val('balances');
  const ear=b?num(b.earnings):null;
  if(ear!=null&&usd>ear)return 'wd_e_balance';
  const rc=refCount();
  if(rc!=null&&rc<MIN_REFS)return 'wd_e_refs';
  return null;
}

function suggested(){
  const raw=String((tgUser&&tgUser.language_code)||navigator.language||'').toLowerCase();
  if(!raw)return null;
  return LANGS.find(l=>l.code.toLowerCase()===raw)||LANGS.find(l=>l.code.toLowerCase()===raw.split('-')[0])||null;
}
function langRows(){
  const q=S.langFilter.trim().toLowerCase();
  let list=LANGS.filter(l=>!q||l.native.toLowerCase().indexOf(q)>-1||l.en.toLowerCase().indexOf(q)>-1||l.code.toLowerCase().indexOf(q)>-1);
  if(!q){const sg=suggested();if(sg)list=[sg].concat(list.filter(l=>l!==sg));}
  if(!list.length)return '<p class="muted">'+T('lang_none')+'</p>';
  return list.map(l=>{
    const cur=(l.code===S.lang&&!S.firstLang);
    return '<button type="button" class="lang'+(cur?' on':'')+'" data-act="langPick" data-v="'+esc(l.code)+'"><span><b dir="auto">'+esc(l.native)+'</b><small>'+esc(l.en)+'</small></span><span>'+(isFull(l.code)?'':'<span class="pt">◐</span> ')+(cur?'<span class="mk">✓</span>':'')+'</span></button>';
  }).join('');
}

const LINK_AREA={emailStart:'email',emailVerify:'email',linkStart:'link',linkConfirm:'link',tgToken:'tg'};
async function linkSubmit(kind){
  const L=S.link,f=L.f;
  if(L.busy||!LINK_AREA[kind])return;
  L.area=LINK_AREA[kind];
  const bad=k=>{L.msg={kind:'bad',text:t(k)};renderOverlay();};
  const gm=guardMsg();
  if(gm){L.msg={kind:'warn',text:gm};renderOverlay();return;}
  let path,body;
  if(kind==='emailStart'){const e=f.email.trim().toLowerCase();if(!EMAIL_RE.test(e))return bad('auth_e_email');path='emailLinkStart';body={email:e};}
  else if(kind==='emailVerify'){if(!/^\d{6}$/.test(f.code.trim()))return bad('auth_e_code');path='emailLinkVerify';body={email:f.email.trim().toLowerCase(),code:f.code.trim()};}
  else if(kind==='linkStart'){if(!f.id.trim()||!f.pass)return bad('auth_e_id');path='accountLinkStart';body={identifier:f.id.trim(),password:f.pass};}
  else if(kind==='linkConfirm'){if(!/^\d{6}$/.test(f.code.trim()))return bad('auth_e_code');path='accountLinkConfirm';body={code:f.code.trim()};}
  else{path='telegramLinkToken';body={};}
  L.busy=true;L.msg=null;renderOverlay();
  try{
    const d=await api('POST',path,body);
    if(kind==='emailStart'){L.emailStep='code';f.code='';}
    else if(kind==='emailVerify'){
      if(d&&d.user&&typeof d.user==='object')R.profile={s:'ok',v:d.user};
      else if(d&&d.verified===true)R.profile={s:'ok',v:Object.assign({},val('profile')||{},{email:f.email.trim().toLowerCase(),emailVerified:true})};
      else throw{code:'HTTP',status:400,data:{}};
      L.emailOpen=false;L.emailStep='form';f.code='';L.msg={kind:'ok',text:t('prof_email_done')};
    }else if(kind==='linkStart'){L.linkStep='code';f.pass='';f.code='';}
    else if(kind==='linkConfirm'){
      if(d&&d.user&&typeof d.user==='object'){
        R.profile={s:'ok',v:d.user};L.linkStep='form';f.id='';f.pass='';f.code='';L.msg={kind:'ok',text:t('prof_link_done')};
        refreshAfterMoney();
      }else throw{code:'HTTP',status:400,data:{}};
    }else{
      const tk=(d&&typeof d.token==='string')?d.token:'';
      if(!/^[A-Za-z0-9_-]{8,58}$/.test(tk))throw{code:'HTTP',status:500,data:{}};
      L.tgUrl=String(CONFIG.TELEGRAM_BOT_LINK).replace(/\/+$/,'')+'?'+(CONFIG.TELEGRAM_START_PARAM||'start')+'=link_'+tk;
    }
  }catch(e){
    if(e&&e.code==='HTTP'){
      const c=e.data&&e.data.code,st=e.status;
      if(st===429)L.msg={kind:'bad',text:t('auth_too_many')};
      else if(c==='TELEGRAM_ALREADY_LINKED')L.msg={kind:'bad',text:t('prof_link_conflict')};
      else if(c==='EMAIL_TAKEN'||(kind==='emailStart'&&st===409))L.msg={kind:'bad',text:t('auth_email_taken')};
      else if(kind==='linkStart')L.msg={kind:'bad',text:t('auth_wrong')};
      else if(kind==='emailVerify'||kind==='linkConfirm')L.msg={kind:'bad',text:t('auth_code_bad')};
      else L.msg={kind:'bad',text:t('load_error')+extra(e.data)};
    }else L.msg={kind:'bad',text:t('load_error')};
  }
  L.busy=false;renderOverlay();
}

async function loadDeposit(id){
  const n=netById(id);
  if(!n)return;
  const g=gate();
  if(g!=='ok'){
    DEP[id]={s:g==='unavailable'?'unavailable':g==='signin'?'signin':g==='error'?'error':'loading'};
    if(S.overlay==='deposit')renderOverlay();
    return;
  }
  if(acctBlocked()||hasAccount()===false)return;
  DEP[id]={s:'loading'};
  if(S.overlay==='deposit')renderOverlay();
  try{
    const d=await api('GET','depositAddress',undefined,undefined,'network='+encodeURIComponent(n.id)+'&currency='+encodeURIComponent(n.cid));
    DEP[id]={s:'ok',v:(d&&typeof d==='object')?d:{}};
  }catch(e){DEP[id]={s:'error'};}
  if(S.overlay==='deposit')renderOverlay();
}
/* Returns a usable address only if the backend's reply names the SAME network the user selected. */
function depInfo(id){
  const n=netById(id);
  const r=DEP[id];
  if(!n||!r||r.s!=='ok')return null;
  const d=r.v||{};
  const net=String(d.network||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const cur=String(d.currency||'').toUpperCase();
  const a=String(d.address||'').trim();
  const netOk=!!net&&n.alias.indexOf(net)>-1;
  const curOk=!cur||cur===n.cid||cur==='USDT';
  if(!netOk||!curOk||!n.re.test(a))return{address:null,deposits:[]};
  return{address:a,deposits:Array.isArray(d.deposits)?d.deposits:[]};
}
function qrSvg(text){
  try{
    if(typeof window.qrcode!=='function')return '';
    const q=window.qrcode(0,'M');q.addData(text);q.make();
    return q.createSvgTag({cellSize:4,margin:0,scalable:true});
  }catch(e){return '';}
}

  h+='<h3 style="margin:14px 0 8px;font-size:13px;color:var(--muted)">'+T('dep_status')+'</h3>';
  if(info&&info.deposits.length){
    h+='<ul class="hist">'+info.deposits.slice(0,20).map(x=>{

  h+='<p class="muted small" style="margin:8px 0 0">'+T('dep_wait')+'</p>';

function openConfirm(cfg){

async function confirmGo(){
  const c=S.confirm;
  if(!c||c.busy||c.done)return;
  c.busy=true;c.msg=null;renderOverlay();
  let r;
  try{r=await c.run();}catch(e){r={ok:false,text:t('net_unknown')};}
  c.busy=false;
  if(r.ok){c.done=true;c.msg={kind:'ok',text:r.text};}
  else c.msg={kind:'bad',text:r.text};
  if(S.confirm===c)renderOverlay();
}

/* ---------------- actions ---------------- */
async function buyQuote(){
  const B=S.buy;
  const amt=parseAmt(B.amount);
  if(!amt){B.msg={kind:'bad',text:t('buy_invalid')};renderMain();return;}
  if(hasAccount()===false){B.msg={kind:'warn',text:t('reg_needed')};B.quote=null;renderMain();return;}
  if(lowBalance(amt)){B.msg={kind:'warn',text:t('err_insufficient')};B.quote=null;renderMain();return;}
  const gm=guardMsg();
  if(gm){B.msg={kind:'warn',text:gm};renderMain();return;}
  B.busy=true;B.msg=null;B.quote=null;renderMain();
  const coin=B.coin;
  try{
    const d=await api('POST','buyQuote',{coin:coin,amountUsdt:amt});
    if(d&&d.quoteId&&num(d.estimatedAmount)!=null){
      B.quote={id:String(d.quoteId),est:num(d.estimatedAmount),fee:(d.fee!=null?num(d.fee):null),feeAsset:d.feeAsset?String(d.feeAsset):'USDT',expires:d.expiresAt?Date.parse(d.expiresAt):null,coin:coin,amt:amt,expired:false};
      if(B.quote.expires!=null&&isNaN(B.quote.expires))B.quote.expires=null;
    }else B.msg={kind:'bad',text:t('buy_failed')};
  }catch(e){B.msg={kind:'bad',text:t('buy_failed')+extra(e&&e.data)};}
  B.busy=false;renderMain();
}
function buyReview(){
  const k=S.buy.quote;
  if(!k)return;
  if(k.expires&&Date.now()>k.expires){S.buy.quote=null;S.buy.msg={kind:'warn',text:t('buy_expired')};renderMain();return;}
  if(lowBalance(k.amt)){S.buy.msg={kind:'warn',text:t('err_insufficient')};S.buy.quote=null;renderMain();return;}
  openConfirm({
    title:t('buy_confirm_btn'),
    rows:[
      [T('lbl_coin'),esc(k.coin)],
      [T('buy_amount'),ltr(esc(fmtNum(k.amt,2))+' USDT')],
      [T('buy_est'),ltr(esc(fmtNum(k.est,8))+' '+esc(k.coin))],
      [T('buy_fees'),k.fee!=null?ltr(esc(fmtNum(k.fee,8))+' '+esc(k.feeAsset)):'—']
    ],
    body:'',goLabel:t('buy_confirm_btn'),
    run:async()=>{
      const gm=guardMsg();
      if(gm)return{ok:false,text:gm};
      if(k.expires&&Date.now()>k.expires)return{ok:false,text:t('buy_expired')};
      const sig='buy|'+k.id;
      try{
        const d=await api('POST','buyExecute',{quoteId:k.id},keyFor(sig));
        delete KEYS[sig];
        if(d&&d.completed===true){
          S.buy.quote=null;S.buy.amount='';S.buy.msg=null;
          refreshAfterMoney();
          return{ok:true,text:t('buy_done')};
        }
        return{ok:false,text:t('buy_failed')+extra(d)};
      }catch(e){
        if(e&&e.code==='HTTP'){delete KEYS[sig];return{ok:false,text:t('buy_failed')+extra(e.data)};}
        if(e&&e.code==='NOT_CONFIGURED')return{ok:false,text:t('unavail_body')};
        return{ok:false,text:t('net_unknown')};
      }
    }

function betReview(){
  const b=S.bet;
  if(ageState()!=='ok'){b.msg={kind:'warn',text:t('age_needed')};renderMain();return;}
  if(hasAccount()===false){b.msg={kind:'warn',text:t('reg_needed')};renderMain();return;}
  if(!b.coin||!b.pred||!b.stake){b.msg={kind:'warn',text:t('bet_pick_all')};renderMain();return;}
  if(lowBalance(b.stake)){b.msg={kind:'warn',text:t('err_insufficient')};renderMain();return;}
  const coin=b.coin,pred=b.pred,stake=b.stake,payout=payoutFor(coin,stake);
  if(!payout){b.msg={kind:'warn',text:t('bet_pick_all')};renderMain();return;}
  b.msg=null;
  const cp=price(coin);
  openConfirm({
    title:t('bet_confirm_title'),
    rows:[
      [T('lbl_coin'),esc(coin)],
      [T('lbl_prediction'),T(PREDK[pred.toLowerCase()])],
      [T('lbl_duration'),T('days7')],
      [T('lbl_stake'),ltr(esc(fmtNum(stake,0))+' USDT')],
      [T('lbl_payout'),ltr(esc(fmtNum(payout,0))+' USDT')],
      [T('lbl_price'),cp?ltr(esc(fmtUsd(cp))):T('price_unavailable')]
    ],
    body:'<p class="small muted" style="margin:12px 0 4px">'+T('bet_confirm_note')+'</p><p class="small muted" style="margin:0 0 4px">'+T('bet_rule_1')+'</p><p class="small muted" style="margin:0 0 4px">'+T('bet_loss_line',{back:fmtNum(stake/2,0),lost:fmtNum(stake/2,0)})+'</p><p class="small muted" style="margin:0">'+T('bet_rule_3')+'</p>',
    goLabel:t('bet_place'),
    run:async()=>{
      if(ageState()!=='ok')return{ok:false,text:t('age_needed')};
      const gm=guardMsg();
      if(gm)return{ok:false,text:gm};
      const sig='bet|'+coin+'|'+pred+'|'+stake;
      try{
        const d=await api('POST','betCreate',{coin:coin,prediction:pred,stake:stake,durationDays:7},keyFor(sig));
        delete KEYS[sig];
        if(d&&d.accepted===true){
          S.bet={coin:null,pred:null,stake:null,msg:null};
          refreshAfterMoney();
          return{ok:true,text:t('bet_accepted')};
        }
        return{ok:false,text:t('bet_rejected')+extra(d)};
      }catch(e){
        if(e&&e.code==='HTTP'){delete KEYS[sig];return{ok:false,text:t('bet_rejected')+extra(e.data)};}
        if(e&&e.code==='NOT_CONFIGURED')return{ok:false,text:t('unavail_body')};
        return{ok:false,text:t('net_unknown')};
      }
    }
  });
}

async function saveUsername(raw){
  const u=String(raw||'').trim().replace(/^@/,'');
  if(!/^[A-Za-z0-9_]{3,32}$/.test(u)){S.prof.msg={kind:'bad',text:t('prof_invalid')};renderOverlay();return;}
  const gm=guardMsg();
  if(gm){S.prof.msg={kind:'warn',text:gm};renderOverlay();return;}
  S.prof.msg={kind:'warn',text:t('loading')};renderOverlay();
  try{
    const d=await api('POST','setUsername',{username:u},keyFor('uname|'+u));
    delete KEYS['uname|'+u];
    if(d&&typeof d.username==='string'&&d.username){
      R.profile={s:'ok',v:Object.assign({},val('profile')||{},d)};
      S.prof.msg=null;S.prof.input='';
      renderOverlay();toast(t('prof_saved'));
    }else{S.prof.msg={kind:'bad',text:t('load_error')};renderOverlay();}
  }catch(e){
    if(e&&e.code==='HTTP'){
      delete KEYS['uname|'+u];
      S.prof.msg={kind:'bad',text:(e.status===409)?t('prof_taken'):(t('load_error')+extra(e.data))};
    }else S.prof.msg={kind:'bad',text:t('net_unknown')};
    renderOverlay();
  }
}

  if(!m)return;
  box.dataset.mounted='1';
  const s=document.createElement('script');
  s.async=true;s.src='https://telegram.org/js/telegram-widget.js?22';
  s.setAttribute('data-telegram-login',m[1]);
  s.setAttribute('data-size','large');
  s.setAttribute('data-radius','12');
  s.setAttribute('data-request-access','write');
  s.setAttribute('data-onauth','onTelegramAuth(user)');
  box.appendChild(s);
}
/* Telegram's login button calls this with data Telegram signed. The system verifies the signature; this page only forwards it. */
window.onTelegramAuth=function(user){webTelegramLogin(user);};
async function webTelegramLogin(user){
  const W=S.web;
  if(W.busy)return;
  if(!user||typeof user!=='object'||!user.id||!user.hash||!user.auth_date)return;
  if(!backendReady()){W.msg={kind:'warn',text:t('unavail_title')+'. '+t('unavail_body')};renderWelcome();return;}
  W.busy=true;W.msg=null;renderWelcome();
  try{
    const d=await api('POST','telegramLogin',{authData:user});
    if(d&&d.user&&typeof d.user==='object'){
      S.session.s='ok';S.session.web=true;S.session.token=null;
      R.profile={s:'ok',v:d.user};
      W.screen=null;W.msg=null;W.busy=false;
      rerender();loadRoute();
      return;
    }
    W.msg={kind:'bad',text:t('load_error')};
  }catch(e){
    if(e&&e.code==='HTTP'){
      const c=e.data&&e.data.code,st=e.status;
      if(st===404||c==='NO_ACCOUNT')W.msg={kind:'bad',text:t('auth_tg_none')};
      else if(st===429)W.msg={kind:'bad',text:t('auth_too_many')};
      else if(c==='ACCOUNT_BANNED')W.msg={kind:'bad',text:t('acct_ban_title')};
      else if(c==='ACCOUNT_SUSPENDED')W.msg={kind:'bad',text:t('acct_susp_title')};
      else W.msg={kind:'bad',text:t('load_error')+extra(e.data)};
    }else W.msg={kind:'bad',text:t('load_error')};
  }
  W.busy=false;renderWelcome();
}
function renderWelcome(){
  const el=$('#welcome');
  const s=S.web.screen;
  if(!s||IN_TG){el.innerHTML='';return;}
  const a=document.activeElement;
  const fid=(a&&a.id&&el.contains(a))?a.id:null;
  const ss=fid?a.selectionStart:null;
  el.innerHTML=viewWeb(s);
  if(s==='login')mountTgWidget();
  if(fid){const n=document.getElementById(fid);if(n){n.focus();try{n.setSelectionRange(ss,ss);}catch(e){}}}
}
/* The system (not this page) verifies emails, passwords and codes. This page only sends what the user typed and shows the reply. */
async function webSubmit(kind){
  const W=S.web,f=W.f;
  if(W.busy)return;
  const fail=k=>{W.msg={kind:'bad',text:t(k)};renderWelcome();};
  const email=f.email.trim().toLowerCase();
  let path,body;
  if(kind==='email'||kind==='resetStart'){
    if(!EMAIL_RE.test(email))return fail('auth_e_email');
    path=(kind==='email')?'emailStart':'resetStart';
    body=(kind==='email')?{email:email,referralCode:REF||undefined}:{email:email};
  }else if(kind==='verify'||kind==='resetConfirm'){
    if(!/^\d{6}$/.test(f.code.trim()))return fail('auth_e_code');
    if(f.pass.length<8)return fail('auth_e_pw');
    path=(kind==='verify')?'emailVerify':'resetConfirm';
    body={email:email,code:f.code.trim(),password:f.pass};
  }else if(kind==='register'){
    const user=f.user.trim().replace(/^@/,'');
    if(!/^[A-Za-z0-9_]{3,32}$/.test(user))return fail('prof_invalid');
    if(!W.ticket)return fail('auth_code_bad');
    path='register';body={ticket:W.ticket,username:user,referralCode:REF||undefined};
  }else if(kind==='login'){
    const id=f.id.trim();
    if(!id||!f.pass)return fail('auth_e_id');
    path='login';body={identifier:id,password:f.pass};
  }else return;
  if(!backendReady()){W.msg={kind:'warn',text:t('unavail_title')+'. '+t('unavail_body')};renderWelcome();return;}
  W.busy=true;W.msg=null;renderWelcome();
  try{
    const d=await api('POST',path,body);
    if(kind==='email'||kind==='resetStart'){
      W.step='code';W.cool=60;f.code='';f.pass='';W.msg=null;
    }else if(kind==='verify'){
      if(d&&d.verified===true&&typeof d.ticket==='string'&&d.ticket){W.ticket=d.ticket;W.step='username';f.pass='';f.code='';W.msg=null;}
      else W.msg={kind:'bad',text:t('auth_code_bad')};
    }else if(kind==='resetConfirm'){
      W.screen='login';W.step='email';f.pass='';f.code='';W.msg={kind:'ok',text:t('auth_reset_done')};
    }else{
      if(d&&d.user&&typeof d.user==='object'){
        S.session.s='ok';S.session.web=true;S.session.token=null;
        R.profile={s:'ok',v:d.user};
        f.pass='';f.code='';W.ticket=null;W.screen=null;W.msg=null;W.busy=false;
        rerender();loadRoute();
        return;
      }
      W.msg={kind:'bad',text:t('load_error')};
    }
  }catch(e){
    if(e&&e.code==='HTTP'){
      const c=e.data&&e.data.code,st=e.status;
      if(st===429)W.msg={kind:'bad',text:t('auth_too_many')};
      else if(c==='ACCOUNT_BANNED')W.msg={kind:'bad',text:t('acct_ban_title')};
      else if(c==='ACCOUNT_SUSPENDED')W.msg={kind:'bad',text:t('acct_susp_title')};
      else if(kind==='login')W.msg={kind:'bad',text:t('auth_wrong')};
      else if(kind==='verify'||kind==='resetConfirm')W.msg={kind:'bad',text:t('auth_code_bad')};
      else if(kind==='email'&&st===409)W.msg={kind:'bad',text:t('auth_email_taken')};
      else if(kind==='register'){
        if(st===409)W.msg={kind:'bad',text:t('prof_taken')};
        else if(st===401||st===410){W.step='email';W.ticket=null;W.msg={kind:'bad',text:t('auth_code_bad')};}
        else W.msg={kind:'bad',text:t('load_error')+extra(e.data)};
      }
      else W.msg={kind:'bad',text:t('load_error')+extra(e.data)};
    }else W.msg={kind:'bad',text:t('load_error')};
  }
  W.busy=false;renderWelcome();
}
setInterval(()=>{
  if(S.web.cool>0){
    S.web.cool--;
    const b=$('#wResend');
    if(b){b.textContent=S.web.cool>0?t('auth_resend_in',{s:S.web.cool}):t('auth_resend');b.disabled=S.web.cool>0;}
  }
},1000);

/* ---------------- start ---------------- */
function init(){
  const saved=store.get('bc_lang');
  if(saved&&LANGS.some(l=>l.code===saved)){S.lang=saved;}
  else{S.firstLang=true;S.overlay='language';}
  if(!IN_TG)S.web.screen=REF?'landing':'welcome';   /* Telegram users go straight into the app */
  applyLang();
  rerender();
  if(!TR[S.lang])loadTranslations(S.lang);
  refreshPrices();
  setInterval(refreshPrices,REFRESH_MS);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-S.priceTs>REFRESH_MS)refreshPrices();});
  initSession().then(()=>{rerender();loadRoute();});
}
init();
})();
