let curLang = localStorage.getItem('app_lang') || '';
function applyLang(lang){
 curLang = lang;
 localStorage.setItem('app_lang', lang);
 let t = T[lang] || T.en;
 document.documentElement.dir = (['ar','ur','fa'].includes(lang))?'rtl':'ltr';
 document.querySelectorAll('[data-i18n]').forEach(el=>{
  let k = el.getAttribute('data-i18n');
  if(t[k]) el.innerText = t[k];
 });
 document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
  let k = el.getAttribute('data-i18n-ph');
  if(t[k]) el.placeholder = t[k];
 });
 document.getElementById('curLangFlag').innerText = lang.toUpperCase();
 let f2=document.getElementById('curLangFlag2'); if(f2) f2.innerText=lang.toUpperCase();
 document.getElementById('langM').classList.add('hidden');
}
function openLang(){renderLangList();document.getElementById('langM').classList.remove('hidden');}
function renderLangList(filter=''){
 let c=document.getElementById('langList'); c.innerHTML='';
 LANG_LIST.filter(l=> l.n.toLowerCase().includes(filter.toLowerCase()) || l.c.includes(filter.toLowerCase())).forEach(l=>{
  let b=document.createElement('button');
  b.className='bg-zinc-800 py-3 rounded-xl font-bold text-sm flex justify-between px-3 border '+(curLang===l.c?'border-yellow-600':'border-transparent');
  b.innerHTML=`<span>${l.f} ${l.n}</span><span class="text-[10px] opacity-50">${l.c.toUpperCase()}</span>`;
  b.onclick=()=>applyLang(l.c);
  c.appendChild(b);
 });
}
function autoDetectLang(){
 try{
  let tgLang = Telegram.WebApp.initDataUnsafe.user?.language_code || navigator.language || 'en';
  tgLang = tgLang.split('-')[0].toLowerCase();
  if(LANG_LIST.map(x=>x.c).includes(tgLang)) return tgLang;
  return 'en';
 }catch(e){return 'en';}
}
