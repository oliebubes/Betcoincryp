<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetCoin Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131a;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      margin-top: 20px;
    }

    .wallet {
      background: #1c2230;
      border-radius: 18px;
      padding: 25px;
      margin: 25px 0;
    }

    . point{
      font-size: 38px;
      font-weight: bold;
      margin: 10px;
    }

    .card {
      background: #1c2230;
      border-radius: 15px;
      padding: 20px;
      margin-top: 18px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .win {
      background: #21c77a;
      color: white;
    }

    .lose {
      background: #e74c3c;
      color: white;
    }

    .reset {
      background: #555;
      color: white;
    }

    .notice {
      font-size: 13px;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🪙 BetCoin Demo</h1>

    <div class="wallet">
      <div>My Points</div>
      <div class="points" id="points">1000</div>
      <div>POINTS</div>
    </div>

    <div class="card">
      <h2>Game</h2>
      <p>Choose the result</p>

      <button class="win" onclick="addPoints()">
        Win +100 Points
      </button>

      <button class="lose" onclick="removePoints()">
        Lose -100 Points
      </button>

      <button class="reset" onclick="resetPoints()">
        Reset Points
      </button>
    </div>

    <p class="notice">
      Demo only — points have no cash value and cannot be exchanged for money.
    </p>

  </div>

  <script>
    let points = 1000;

    function updateScreen() {
      document.getElementById("points").textContent = points;
    }

    function addPoints() {
      points += 100;
      updateScreen();
    }

    function removePoints() {
      if (points >= 100) {
        points -= 100;
      }
      updateScreen();
    }

    function resetPoints() {
      points = 1000;
      updateScreen();
    }
  </script>

</body>
</html>
